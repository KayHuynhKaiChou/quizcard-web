<div class="library-page">
  <div class="library-header">
    <h1>Study Sets Library</h1>
    <p class="subtitle">Browse and learn from your vocabulary collections</p>
  </div>

  <div class="loading-container" *ngIf="isLoading$ | async">
    <i class="pi pi-spin pi-spinner" style="font-size: 2rem"></i>
    <p>Loading study sets...</p>
  </div>

  <div class="studyset-grid" *ngIf="!(isLoading$ | async)">
    <app-studyset-card
      *ngFor="let studySet of studySets$ | async"
      [studySet]="studySet">
    </app-studyset-card>
  </div>

  <div class="empty-state" *ngIf="!(isLoading$ | async) && (studySets$ | async)?.length === 0">
    <i class="pi pi-book" style="font-size: 4rem; color: #ccc;"></i>
    <p>No study sets available</p>
  </div>
</div>

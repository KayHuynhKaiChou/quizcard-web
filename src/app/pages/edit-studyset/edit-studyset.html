@if (isLoading()) {
} @else if (studySet) {
<app-study-set-form-page [pageTitle]="'Chỉnh sửa bộ thẻ'" [pageSubtitle]="studySet.title" manualTabLabel="Chỉnh sửa"
  mode="edit" [backUrl]="'/set/' + studySetId">
  <ng-container manual>
    <app-study-set-form [initialData]="studySet" submitLabel="Lưu thay đổi" [isSubmitting]="isSubmitting()"
      (formSubmit)="onFormSubmit($event)" />
  </ng-container>
</app-study-set-form-page>
} @else {
<div class="edit-loading-state">
  <i class="pi pi-exclamation-triangle" style="font-size: 2rem; color: #ef4444"></i>
  <p>Không tìm thấy bộ thẻ</p>
</div>
}

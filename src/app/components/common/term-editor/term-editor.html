<div class="term-editor">
  <div class="term-header">
    @if (mode === 'edit') {
      <span class="term-count">Đang xem {{ rows().length }} / {{ displayTotal }} thuật ngữ</span>
    } @else {
      <span class="term-count">{{ rows().length }} thuật ngữ</span>
    }
  </div>

  <div class="term-list" #termList>
    @for (row of rows(); track trackByKey($index, row)) {
      <div class="term-row">
        <div class="row-top">
          <span class="row-number">{{ $index + 1 }}</span>
          @if (canRemove($index)) {
            <button
              pButton
              icon="pi pi-trash"
              class="p-button-text p-button-danger p-button-sm delete-btn"
              (click)="removeRow($index)">
            </button>
          }
        </div>
        <div class="row-fields">
          <textarea
            pTextarea
            placeholder="Thuật ngữ"
            [(ngModel)]="row.term"
            (ngModelChange)="onFieldChange(row)"
            [appAutoGrow]="row.term"
            [autoGrowMaxRows]="maxRows"
            class="term-input"
            rows="1"
          ></textarea>
          <textarea
            pTextarea
            placeholder="Nghĩa / Định nghĩa"
            [(ngModel)]="row.definition"
            (ngModelChange)="onFieldChange(row)"
            [appAutoGrow]="row.definition"
            [autoGrowMaxRows]="maxRows"
            class="term-input"
            rows="1"
          ></textarea>
        </div>
      </div>
    }
  </div>

  @if (hasMore) {
    <div class="load-more-wrapper">
      <button class="load-more-btn" (click)="onLoadMore()" [disabled]="isLoadingMore">
        @if (isLoadingMore) {
          <i class="pi pi-spin pi-spinner"></i> Đang tải...
        } @else {
          Hiển thị thêm
          <i class="pi pi-chevron-down"></i>
        }
      </button>
    </div>
  }

  <button
    pButton
    label="Thêm thuật ngữ"
    icon="pi pi-plus"
    class="p-button-outlined p-button-sm add-btn"
    (click)="addRow()">
  </button>
</div>

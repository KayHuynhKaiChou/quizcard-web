<div class="term-editor">
  <div class="term-header">
    <span class="term-count">{{ rows().length }} thuật ngữ</span>
  </div>

  <div class="term-list">
    @for (row of rows(); track trackByIndex($index)) {
      <div class="term-row">
        <div class="row-top">
          <span class="row-number">{{ $index + 1 }}</span>
          @if ($index >= 2) {
            <button
              pButton
              icon="pi pi-trash"
              class="p-button-text p-button-danger p-button-sm delete-btn"
              (click)="removeRow($index)">
            </button>
          }
        </div>
        <div class="row-fields">
          <textarea
            pTextarea
            placeholder="Thuật ngữ"
            [(ngModel)]="row.term"
            (ngModelChange)="onFieldChange()"
            (input)="autoResize($event.target)"
            class="term-input"
            rows="1"
          ></textarea>
          <textarea
            pTextarea
            placeholder="Nghĩa / Định nghĩa"
            [(ngModel)]="row.definition"
            (ngModelChange)="onFieldChange()"
            (input)="autoResize($event.target)"
            class="term-input"
            rows="1"
          ></textarea>
        </div>
      </div>
    }
  </div>

  <button
    pButton
    label="Thêm thuật ngữ"
    icon="pi pi-plus"
    class="p-button-outlined p-button-sm add-btn"
    (click)="addRow()">
  </button>
</div>

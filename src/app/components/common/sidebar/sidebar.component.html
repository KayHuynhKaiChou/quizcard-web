<!-- Mobile Backdrop -->
@if (sidebarService.isOpenValue) {
  <div class="sidebar-backdrop" (click)="onBackdropClick()"></div>
}

<aside class="sidebar" [class.collapsed]="!sidebarService.isOpenValue">
  <nav class="sidebar-nav">
    <ul class="nav-list">
      @for (item of navItems; track item.route) {
        <li
          class="nav-item"
          [class.active]="item.isActive"
          (click)="onNavClick(item)"
        >
          <a [routerLink]="item.route" class="nav-link">
            <i [class]="'pi ' + item.icon" class="nav-icon"></i>
            <span class="nav-label">{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>

  <div class="sidebar-separator"></div>
</aside>

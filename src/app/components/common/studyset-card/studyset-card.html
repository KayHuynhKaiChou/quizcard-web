<div class="studyset-card" [routerLink]="['/set', studySet.id]">
  <div class="card-header">
    <h3 class="card-title" [title]="studySet.title">{{ studySet.title }}</h3>
    <span
      class="mode-badge"
      [class.public]="studySet.visibility === 'PUBLIC'"
      [class.private]="studySet.visibility === 'PRIVATE'"
      [class.shared]="studySet.visibility === 'SHARED'">
      {{ studySet.visibility | lowercase }}
    </span>
  </div>

  <div class="card-body">
    <p class="terms-count">{{ studySet.termsCount }} terms</p>

    @if (studySet.category) {
      <span class="category-tag">{{ studySet.category }}</span>
    }

    @if (studySet.description) {
      <p class="description">{{ studySet.description }}</p>
    }
  </div>
</div>

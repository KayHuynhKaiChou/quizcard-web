<div class="studyset-card" [routerLink]="['/set', studySet.id]">
  <div class="card-header">
    <h3 class="card-title" [title]="studySet.title">{{ studySet.title }}</h3>
    <span
      class="mode-badge"
      [class.public]="studySet.mode === 'public'"
      [class.private]="studySet.mode === 'private'">
      {{ studySet.mode }}
    </span>
  </div>

  <div class="card-body">
    <p class="terms-count">{{ studySet.vocabularies.length }} terms</p>

    <div class="author-info">
      <div class="author-avatar">
        <i class="pi pi-user"></i>
      </div>
      <span class="author-name">{{ studySet.author }}</span>
    </div>
  </div>
</div>

<div class="study-set-form">
  <div class="form-section">
    <label class="form-label" for="title">Tiêu đề <span class="required">*</span></label>
    <input
      pInputText
      id="title"
      type="text"
      placeholder="Nhập tiêu đề bộ thẻ..."
      [(ngModel)]="title"
      class="form-input"
    />
  </div>

  <div class="form-section">
    <label class="form-label" for="description">Mô tả</label>
    <textarea
      pTextarea
      id="description"
      placeholder="Thêm mô tả cho bộ thẻ..."
      [(ngModel)]="description"
      rows="3"
      class="form-input"
    ></textarea>
  </div>

  <div class="form-section">
    <label class="form-label">Chế độ hiển thị</label>
    <p-select
      [options]="visibilityOptions"
      [(ngModel)]="visibility"
      optionLabel="label"
      optionValue="value"
      class="form-select"
    />
  </div>

  <div class="form-divider"></div>

  <app-term-editor
    [mode]="mode"
    [initialTerms]="termRows"
    [totalCount]="totalTermCount"
    [hasMore]="hasMoreTerms"
    [isLoadingMore]="isLoadingMoreTerms"
    (termsChange)="onTermsChange($event)"
    (rowChanged)="termRowChanged.emit($event)"
    (rowRemoved)="termRowRemoved.emit($event)"
    (loadMore)="loadMoreTerms.emit()"
  />

  @if (mode === 'edit') {
    <!-- Thanh hành động dính đáy: bộ thẻ dài hàng trăm dòng nên nút lưu phải luôn với tới được -->
    <div class="form-footer-bar">
      @if (pendingTermChanges > 0) {
        <span class="footer-pending">
          <i class="pi pi-pencil"></i> {{ pendingTermChanges }} thay đổi chưa lưu
        </span>
      }
      @if (backUrl) {
        <a pButton class="p-button-text footer-back" [routerLink]="backUrl">
          <i class="pi pi-arrow-left"></i> Quay lại
        </a>
      }
      <button
        pButton
        [label]="submitLabel"
        icon="pi pi-check"
        class="p-button-success"
        [disabled]="!title.trim() || isSubmitting"
        [loading]="isSubmitting"
        (click)="onSubmit()">
      </button>
    </div>
  } @else {
    <div class="form-actions">
      <button
        pButton
        [label]="submitLabel"
        icon="pi pi-check"
        class="p-button-success"
        [disabled]="!title.trim() || isSubmitting"
        [loading]="isSubmitting"
        (click)="onSubmit()">
      </button>
    </div>
  }
</div>
